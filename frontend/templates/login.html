<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>The Nest - Login</title>
</head>
<body>
    <h2>Accedi a The Nest</h2>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <label>Username o Email:</label><br>
        <input type="text" name="identifier" required><br><br>
        
        <label>Password:</label><br>
        <input type="password" name="password" required><br><br>
        
        <button type="submit">Accedi</button>
    </form>
    <p>Non hai un account? <a href="{{ url_for('signup_step1') }}">Registrati</a></p>
</body>
</html>
