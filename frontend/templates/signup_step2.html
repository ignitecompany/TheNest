<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>The Nest - Completa Profilo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header Avanzato -->
    <header class="w-full border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md px-8 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-black text-indigo-400 tracking-tight">The Nest</span>
        </div>
        <div class="text-xs text-slate-400 font-medium">Step 2 di 2</div>
    </header>

    <!-- Contenuto Principale -->
    <main class="flex-1 flex items-center justify-center p-6 my-8">
        <div class="w-full max-w-lg bg-slate-900/50 border border-slate-800/80 p-8 md:p-10 rounded-3xl backdrop-blur-xl shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold tracking-tight text-white">Quasi fatto!</h1>
                <p class="text-sm text-slate-400 mt-2">Personalizza il tuo profilo per farti conoscere dalla community.</p>
            </div>
            
            {% if error %}
                <div class="mb-6 p-4 bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-2xl text-center">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data" class="space-y-6">
                
                <!-- Sezione Caricamento Immagine Profilo (PFP) -->
                <div class="flex flex-col items-center justify-center space-y-3">
                    <div class="relative group cursor-pointer">
                        <div class="w-24 h-24 rounded-full bg-slate-950 border-2 border-dashed border-slate-700 flex items-center justify-center overflow-hidden hover:border-indigo-500 transition">
                            <span class="text-xs text-slate-500 text-center px-2">Carica foto</span>
                        </div>
                        <input type="file" name="profile_picture" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" title="Seleziona immagine profilo">
                    </div>
                    <span class="text-xs text-slate-400 font-medium">Immagine del profilo (Opzionale)</span>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Username</label>
                    <input type="text" name="username" required class="w-full px-4 py-3.5 bg-slate-950 border border-slate-800 rounded-2xl focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-600 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Bio</label>
                    <textarea rows="4" name="bio" placeholder="Raccontaci di cosa ti occupi, quali tecnologie usi o quali progetti stai sognando di realizzare..." class="w-full px-4 py-3.5 bg-slate-950 border border-slate-800 rounded-2xl focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-600 transition resize-none"></textarea>
                </div>

                <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-600/25 transition duration-200">
                    Entra in The Nest
                </button>
            </form>
        </div>
    </main>

    <!-- Footer Avanzato -->
    <footer class="w-full border-t border-slate-800/80 bg-slate-900/50 backdrop-blur-md px-8 py-6 text-center text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-4">
        <p>&copy; 2026 The Nest Platform. Tutti i diritti riservati.</p>
        <div class="flex space-x-6">
        </div>
    </footer>

</body>
</html>
