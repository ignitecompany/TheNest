services:
  db:
    image: mysql:8.0
    container_name: thenest_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .            
      dockerfile: Dockerfile 
    container_name: thenest_backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app    
      - ./frontend:/frontend   
    env_file:
      - .env
    depends_on:
      - db

volumes:
  mysql_data: